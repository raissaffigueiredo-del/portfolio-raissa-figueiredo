<body>
<div id="app"></div>
<template data-dc>
<div style="background: #F8F4EF; min-height: 100vh">

<header style="border-bottom: 2px solid #E2D9D3">
<div class="wrap" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 76px; flex-wrap: wrap">
<a href="index.html" class="btn b-out" style="min-height: 44px; padding: 0 16px"><span aria-hidden="true">←</span> Voltar ao portfólio</a>
<span class="disp2" style="font-size: 20px">Raissa Figueiredo</span>
<a href="case-03.html" style="text-decoration: none; font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; gap: 8px">Próximo case <span aria-hidden="true">→</span></a>
</div>
</header>

<main>
<section style="background: #2A1F33; color: #F8F4EF; padding: clamp(56px,8vw,112px) 0 clamp(48px,6vw,80px); border-radius: 0 0 48px 48px">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="pill" style="background: #F8F4EF; color: #2A1F33">Case 02</span><span class="pill" style="background: #4A3F55; color: #F8F4EF">Service Design</span><span class="pill" style="background: #4A3F55; color: #F8F4EF">Product Strategy</span><span class="pill" style="background: #4A3F55; color: #F8F4EF">Customer Experience</span><span class="pill" style="background: #4A3F55; color: #F8F4EF">Stakeholder Management</span></div>
<h1 class="disp" style="margin: 0; font-size: clamp(56px,8vw,112px)">Programa <span style="color: #D9A3B0">Aurora Go!</span></h1>
<p style="margin: 0; font-size: clamp(18px,1.6vw,21px); line-height: 1.6; color: #DDD4E0; max-width: 780px">Um programa de capacitação e premiação para a rede de assessores de uma franqueadora que, em vez de uma funcionalidade nova, redesenhou a relação entre pessoas, conhecimento e suporte. No primeiro mês, os chamados técnicos indevidos foram a zero.</p>
<div class="meta">
<div><p style="margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #D9A3B0; font-weight: 700">Contexto</p><p style="margin: 0; font-size: 15px">Aurora Tecnologia SaaS (fictícia) · SaaS B2B</p></div>
<div><p style="margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #D9A3B0; font-weight: 700">Cliente</p><p style="margin: 0; font-size: 15px">Rede TodoSorriso (fictícia) · franqueadora de clínicas odontológicas</p></div>
<div><p style="margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #D9A3B0; font-weight: 700">Lançamento</p><p style="margin: 0; font-size: 15px">21 de maio de 2026 · evento com a assessoria</p></div>
<div><p style="margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #D9A3B0; font-weight: 700">Parceria</p><p style="margin: 0; font-size: 15px">Customer Success e supervisora da rede</p></div>
</div>
</div>
</section>

<div class="wrap">
<p style="margin: 24px 0 0; font-size: 13px; color: #857A8C; display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="sim">Confidencialidade</span>Nomes de empresa, cliente, programa e pessoas são fictícios. Regras, datas e resultados são relatados pela autora; nomes de assessores e unidades não aparecem.</p>

<section class="sec" aria-labelledby="s1" style="margin-top: 24px"><div class="sec-label"><span class="n">01</span><h2 id="s1">Visão geral</h2></div>
<p class="body" style="margin: 0; font-size: 18px">A rede de assessores da franqueadora era quem orientava as clínicas no uso do sistema, mas não conhecia os produtos. O resultado era uma fila de chamados técnicos que não eram técnicos. Concebi um programa com três pilares (aprender, vender, crescer), regras de premiação progressiva, ranking mensal e um roteiro de triagem. A diretoria liberou o orçamento de imediato; Customer Success conduziu a operação com a supervisora da rede. Desde maio de 2026, o programa também virou o meio de explicar à rede o que é um produto, como ele chega ao lançamento e como funciona a assistência antes, durante e depois da aquisição.</p></section>

<section class="sec" aria-labelledby="s2"><div class="sec-label"><span class="n">02</span><h2 id="s2">Contexto</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="body" style="margin: 0">Empresa SaaS B2B com equipe técnica reduzida e um cliente que é, ao mesmo tempo, uma rede de franquias e uma organização com sócios em comum com a empresa de tecnologia. Esse vínculo cria uma linha tênue entre o que é responsabilidade de uma e de outra: ordens e direcionamentos podem se confundir. O programa precisava funcionar como parceria, preservando a boa convivência, sem deixar de marcar quem decide o quê.</p>
<div class="who">
<div><b>Aurora</b>Produto, Customer Success, suporte do sistema e diretoria</div>
<div><b>Rede TodoSorriso</b>Supervisora da rede, central de suporte e a assessoria que atende as unidades</div>
<div><b>Assessores</b>Pessoas da franqueadora que orientam as clínicas no dia a dia; público-alvo do programa</div>
<div><b>Unidades</b>Clínicas odontológicas que usam o sistema e compram os serviços</div>
</div>
</div></section>

<section class="sec" aria-labelledby="s3"><div class="sec-label"><span class="n">03</span><h2 id="s3">Problema</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="disp2" style="margin: 0; font-size: clamp(26px,2.6vw,36px)">Havia o hábito de achar que tudo era problema do sistema.</p>
<p class="body" style="margin: 0">Dificuldades de uso chegavam como incidentes ou sustentação "de natureza incerta": eram categorizadas como erro, falha ou problema do sistema e enviadas no mesmo momento ao time de TI. As etapas de triagem dentro da própria rede eram atropeladas. Isso consumia o tempo do suporte, interrompia o desenvolvimento e gerava atrito entre as duas empresas.</p>
<div aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px">
<span class="pill" style="background: #FFFFFF; border: 2px solid #E2D9D3">Dúvida de uso na clínica</span><span style="color: #B5546A">→</span>
<span class="pill" style="background: #FFFFFF; border: 2px solid #E2D9D3">Assessor não sabe responder</span><span style="color: #B5546A">→</span>
<span class="pill" style="background: #FFFFFF; border: 2px solid #E2D9D3">Vira "erro do sistema"</span><span style="color: #B5546A">→</span>
<span class="pill" style="background: #FFFFFF; border: 2px solid #E2D9D3">Chamado técnico direto</span><span style="color: #B5546A">→</span>
<span class="pill" style="background: #B5546A; color: #F8F4EF">Suporte e TI interrompidos · atrito entre empresas</span>
</div>
</div></section>

<section class="sec" aria-labelledby="s4"><div class="sec-label"><span class="n">04</span><h2 id="s4">Meu papel</h2></div>
<ul class="two" style="margin: 0; padding: 0; list-style: none; gap: 10px">
<li class="li">Identificação dos assessores como atores estratégicos do problema e da solução</li>
<li class="li">Concepção do programa: pilares, regras de participação, premiação progressiva, ranking mensal e critérios de desempate</li>
<li class="li">Organização da comunicação: material de regras para a franqueadora e assessores, convite e cronograma do evento de lançamento</li>
<li class="li">Direcionamento para a criação do roteiro de triagem de suporte</li>
<li class="li">Mediação da relação entre as duas empresas: parceria colaborativa, com papéis e direcionamentos claros</li>
<li class="li">Acompanhamento do ritmo de vendas e efetivações com Customer Success, na planilha de controle do programa</li>
<li class="li">Criação do flyer de divulgação, do convite e do painel de ranking do programa</li>
<li class="li">Revisão do processo de comunicação de atualizações: canal direto com a Central da Rede, comunicado padronizado e publicação na Central do Franqueado</li>
<li class="li">Direcionamento, com QA, da biblioteca de vídeos tutoriais por módulo e por produto em piloto</li>
</ul></section>

<section class="sec" aria-labelledby="s5"><div class="sec-label"><span class="n">05</span><h2 id="s5">Restrições</h2></div>
<ul class="two" style="margin: 0; padding: 0; list-style: none; gap: 10px">
<li class="li">Orçamento condicionado à leitura e ao aceite de CS, suporte e operação antes da liberação pela diretoria</li>
<li class="li">A operação do programa (treinamentos, acompanhamento, relacionamento) não podia depender do time de produto nem de tecnologia</li>
<li class="li">Sócios em comum entre as empresas: cuidado para que direcionamento não virasse ordem, nem parceria virasse omissão</li>
<li class="li">Premiação só por venda efetivada com uso real pela unidade, para não premiar cadastro sem adoção</li>
</ul></section>

<section class="sec" aria-labelledby="s6"><div class="sec-label"><span class="n">06</span><h2 id="s6">Descoberta</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="background: #F3E3E3; border-radius: 20px; padding: clamp(24px,3vw,36px); display: flex; flex-direction: column; gap: 10px">
<p class="kick" style="margin: 0; font-size: 11px">Virada de perspectiva</p>
<p class="disp2" style="margin: 0; font-size: clamp(26px,2.6vw,34px)">O gargalo não estava no sistema nem no suporte. Estava em quem orientava o uso: os assessores não conheciam os produtos.</p>
</div>
<div class="who">
<div><b>Evidência 1</b>Chamados classificados como incidente que, na análise, eram dúvidas de uso ou configuração</div>
<div><b>Evidência 2</b>Triagem interna da rede pulada: o chamado ia direto para a TI</div>
<div><b>Evidência 3</b>Assessores sem repertório sobre produtos e funcionalidades para responder às clínicas</div>
<div><b>Hipótese</b>Se o assessor souber o produto e tiver incentivo para vender e acompanhar, a triagem acontece onde deveria</div>
</div>
</div></section>

<section class="sec" aria-labelledby="s7"><div class="sec-label"><span class="n">07</span><h2 id="s7">Processo</h2></div>
<div style="display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; flex-direction: column; gap: 14px">
<p class="disp2" style="margin: 0; font-size: 28px">Três pilares do programa</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<div class="card" style="display: flex; flex-direction: column; gap: 10px"><span class="kick">01 · Aprender</span><p class="disp2" style="margin: 0; font-size: 22px">Aprender para oferecer com confiança</p><p class="body" style="margin: 0; font-size: 14px">Treinamentos mensais, novos módulos e funcionalidades, cases práticos, materiais de apoio e espaço aberto para dúvidas.</p></div>
<div class="card" style="display: flex; flex-direction: column; gap: 10px"><span class="kick">02 · Vender</span><p class="disp2" style="margin: 0; font-size: 22px">Ativar e oferecer os serviços</p><p class="body" style="margin: 0; font-size: 14px">Boletos, nota fiscal, TEF e assinatura digital. Premiação progressiva por serviço ativado com uso real.</p></div>
<div class="card" style="display: flex; flex-direction: column; gap: 10px"><span class="kick">03 · Crescer</span><p class="disp2" style="margin: 0; font-size: 22px">Gerar crescimento para todos</p><p class="body" style="margin: 0; font-size: 14px">Mais serviços usados pelas clínicas, mais resultado no dia a dia, mais crescimento para a rede e para o assessor.</p></div>
</div>
</div>

<div class="two" style="align-items: start">
<div style="display: flex; flex-direction: column; gap: 14px">
<p class="disp2" style="margin: 0; font-size: 28px">Regras de premiação</p>
<span class="sim" style="align-self: flex-start">Regras divulgadas à rede · valores reais</span>
<div class="card" style="padding: 0; overflow: hidden">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 2px solid #EFE8E1; font-size: 14px"><span>1 serviço ativado no mês</span><strong>R$ 50 por serviço</strong></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 2px solid #EFE8E1; font-size: 14px"><span>2 serviços ativados</span><strong>R$ 70 cada</strong></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 2px solid #EFE8E1; font-size: 14px"><span>3 ou mais serviços</span><strong>R$ 100 cada</strong></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; font-size: 14px; background: #F3E3E3"><span>Ranking mensal</span><strong>1º R$ 500 · 2º R$ 300 · 3º R$ 200</strong></div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4F4556">Só conta serviço ativado com uso real pela unidade. Em empate, somam-se os prêmios das posições ocupadas e divide-se entre os empatados (três em 1º: R$ 1.000 ÷ 3; dois em 2º: R$ 500 ÷ 2).</p>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<p class="disp2" style="margin: 0; font-size: 28px">Simule a premiação</p>
<p style="margin: 0; font-size: 14px; color: #4F4556">A progressão recompensa quem ativa mais de um serviço no mês. Escolha quantos serviços foram ativados com uso real.</p>
<div role="group" aria-label="Quantidade de serviços ativados" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{ simOpts }}" as="o" hint-placeholder-count="5">
<button type="button" class="pick" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}">{{ o.label }}</button>
</sc-for>
</div>
<div aria-live="polite" class="card" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; background: #2A1F33; color: #F8F4EF; border-color: #2A1F33">
<div><p class="kick" style="margin: 0 0 6px; font-size: 11px; color: #D9A3B0">Por serviço</p><p class="disp" style="margin: 0; font-size: 40px">{{ sim.each }}</p></div>
<div><p class="kick" style="margin: 0 0 6px; font-size: 11px; color: #D9A3B0">Total no mês</p><p class="disp" style="margin: 0; font-size: 40px">{{ sim.total }}</p></div>
<p style="margin: 0; grid-column: 1 / -1; font-size: 13px; line-height: 1.6; color: #DDD4E0">{{ sim.note }}</p>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<p class="disp2" style="margin: 0; font-size: 28px">Evento de lançamento · 21 de maio de 2026</p>
<div class="card" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: start">
<div>
<div class="agenda"><strong>08h00</strong><span>Boas-vindas e abertura oficial</span></div>
<div class="agenda"><strong>08h10</strong><span>Apresentação do programa: como nasceu e seus objetivos</span></div>
<div class="agenda"><strong>08h20</strong><span>Regras de participação e premiação</span></div>
<div class="agenda"><strong>08h30</strong><span>Fluxo operacional e controle de vendas</span></div>
</div>
<div>
<div class="agenda"><strong>09h00</strong><span>Serviços disponíveis no programa: nota fiscal e boletos</span></div>
<div class="agenda"><strong>09h10</strong><span>Treinamento: módulo de boletos</span></div>
<div class="agenda"><strong>09h50</strong><span>Dúvidas, alinhamentos e encerramento</span></div>
<p style="margin: 12px 0 0; font-size: 13px; color: #857A8C; line-height: 1.6">Duas horas, com treinamento prático no mesmo evento em que as regras foram apresentadas: o assessor saiu sabendo o que vender e como.</p>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<p class="disp2" style="margin: 0; font-size: 28px">Comunicação de atualizações do sistema</p>
<p class="body" style="margin: 0">Outra falha entre as empresas: atualizações do sistema entravam no ar sem agendamento nem aviso à rede. Funcionalidades e produtos novos apareciam sem que a assessoria soubesse, e o conflito vinha em seguida. O processo foi revisado junto com o programa.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<div class="card" style="display: flex; flex-direction: column; gap: 8px"><span class="kick">1 · Canal direto</span><p class="disp2" style="margin: 0; font-size: 20px">Canal de acesso direto à Central da Rede</p><p class="body" style="margin: 0; font-size: 14px">Toda atualização passa a ser anunciada antes, com data, horário, duração, impacto e orientação.</p></div>
<div class="card" style="display: flex; flex-direction: column; gap: 8px"><span class="kick">2 · Documento padrão</span><p class="disp2" style="margin: 0; font-size: 20px">Comunicado padronizado em dois formatos</p><p class="body" style="margin: 0; font-size: 14px">Atualização pontual (emergência) e atualização programada (planejada, com passo a passo com telas e checklist de validação).</p></div>
<div class="card" style="display: flex; flex-direction: column; gap: 8px"><span class="kick">3 · Central do Franqueado</span><p class="disp2" style="margin: 0; font-size: 20px">Publicação na plataforma da rede</p><p class="body" style="margin: 0; font-size: 14px">Assumi anexar o comunicado diretamente na Central do Franqueado, para evitar atritos e garantir que a informação chegue a quem atende.</p></div>

    const qs = [
      { text: 'O sistema está fora do ar ou exibindo uma mensagem de erro?', yes: 'inc' },
      { text: 'A dificuldade é sobre como usar uma funcionalidade existente?', yes: 'uso' },
      { text: 'É um pedido de melhoria ou de algo que o sistema ainda não faz?', yes: 'prod', no: 'cs' }
    ];
    const results = {
      inc: { title: 'Incidente técnico', text: 'Abrir chamado para o suporte do sistema, com a descrição do erro e o passo a passo para reproduzi-lo.' },
      uso: { title: 'Orientação de uso', text: 'Resolver com o material do programa ou com um assessor capacitado. Não é chamado técnico.' },
      prod: { title: 'Solicitação de produto', text: 'Registrar a sugestão para avaliação do time de produto, sem interromper o desenvolvimento em curso.' },
      cs: { title: 'Customer Success', text: 'Encaminhar ao Customer Success para entender o caso com a unidade.' }
    };
    const done = !!s.result;
    const q = qs[Math.min(s.step, 2)];
    const yes = () => this.setState({ result: results[q.yes] });
    const no = () => { if (s.step >= 2) this.setState({ result: results[q.no] }); else this.setState({ step: s.step + 1 }); };
    const dots = [0, 1, 2].map((i) => ({ bg: i <= s.step ? '#B5546A' : '#EFE8E1' }));

    const n = s.n;
    const each = n >= 3 ? 100 : n === 2 ? 70 : 50;
    const simOpts = [1, 2, 3, 4, 5].map((k) => ({ label: k === 5 ? '5+' : String(k), on: k === n ? 'true' : 'false', pick: () => this.setState({ n: k }) }));
    const sim = { each: 'R$ ' + each, total: 'R$ ' + (each * n), note: n === 1 ? 'Uma ativação com uso real já é premiada.' : n === 2 ? 'Na segunda ativação, o valor de cada serviço sobe 40%.' : 'A partir da terceira ativação, cada serviço vale o dobro da primeira faixa. Soma-se ainda o ranking mensal.' };

    const sales = [
      { l: 'Mai', n: '9', h: '60%', bg: '#B5546A' }, { l: 'Jun', n: '15', h: '100%', bg: '#B5546A' }, { l: 'Jul', n: '1', h: '7%', bg: '#E4DBE6' },
      { l: 'Ago', n: '5', h: '33%', bg: '#E4DBE6' }, { l: 'Set', n: '7', h: '47%', bg: '#E4DBE6' }, { l: 'Out', n: '0', h: '2%', bg: '#E4DBE6' }, { l: 'Nov*', n: '4', h: '27%', bg: '#D9A3B0' }
    ];
    const z = s.zoom;
    const zoomVals = { zoom_flyer: z === 'flyer', zoom_rank: z === 'rank', zoom_comm: z === 'comm', open_flyer: () => this.setState({ zoom: 'flyer' }), open_rank: () => this.setState({ zoom: 'rank' }), open_comm: () => this.setState({ zoom: 'comm' }), close_flyer: () => this.setState({ zoom: null }), close_rank: () => this.setState({ zoom: null }), close_comm: () => this.setState({ zoom: null }) };
    return { ...zoomVals, asking: !done, done, q, qn: s.step + 1, yes, no, result: s.result || results.inc, reset: () => this.setState({ step: 0, result: null }), dots, simOpts, sim, sales };
  }
}
