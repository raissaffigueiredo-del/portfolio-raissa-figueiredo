<style>

<body>
<div id="app"></div>
<template data-dc>
<div style="background: #F8F4EF; min-height: 100vh">

<header style="border-bottom: 2px solid #E2D9D3; background: #F8F4EF">
<div class="wrap" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 76px; flex-wrap: wrap">
<a href="index.html" class="btn b-out" style="min-height: 44px; padding: 0 16px"><span aria-hidden="true">←</span> Voltar ao portfólio</a>
<span class="disp2" style="font-size: 20px">Raissa Figueiredo</span>
<a href="case-02.html" style="text-decoration: none; font-size: 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; gap: 8px">Próximo case <span aria-hidden="true">→</span></a>
</div>
</header>

<main>
<section style="padding: clamp(56px,8vw,112px) 0 clamp(40px,5vw,64px)">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="pill" style="background: #2A1F33; color: #F8F4EF">Case 01</span><span class="pill" style="background: #E4DBE6">Product Management</span><span class="pill" style="background: #E4DBE6">Service Design</span><span class="pill" style="background: #E4DBE6">UX Writing</span><span class="pill" style="background: #E4DBE6">Go-to-market</span></div>
<h1 class="disp" style="margin: 0; font-size: clamp(48px,7vw,104px); max-width: 1050px">Pagamentos Integrados: <span style="color: #B5546A">do piloto ao lançamento.</span></h1>
<p style="margin: 0; font-size: clamp(18px,1.6vw,21px); line-height: 1.6; color: #4F4556; max-width: 780px">Como um produto sem visibilidade de ritmo virou um lançamento com esteira de acompanhamento, quatro pilotos, manuais de apoio, treinamento da rede e oito unidades interessadas no dia da apresentação.</p>
<div class="meta">
<div><p class="kick" style="margin: 0 0 6px; font-size: 11px">Contexto</p><p style="margin: 0; font-size: 15px">Aurora Tecnologia SaaS (fictícia) · SaaS B2B</p></div>
<div><p class="kick" style="margin: 0 0 6px; font-size: 11px">Cliente</p><p style="margin: 0; font-size: 15px">Rede TodoSorriso (fictícia) · franqueadora de clínicas odontológicas</p></div>
<div><p class="kick" style="margin: 0 0 6px; font-size: 11px">Período</p><p style="margin: 0; font-size: 15px">Mai. 2025 a nov. 2026 · minha atuação desde fev. 2026</p></div>
<div><p class="kick" style="margin: 0 0 6px; font-size: 11px">Lançamento</p><p style="margin: 0; font-size: 15px">9 de novembro de 2026, na reunião mensal da rede</p></div>
</div>
<p style="margin: 0; font-size: 13px; color: #857A8C; display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span class="sim">Confidencialidade</span>Nomes de empresa, cliente e parceiros são fictícios. Datas, etapas e resultados são relatados pela autora; valores e dados internos não são exibidos.</p>
</div>
</section>

<div class="wrap">

<section class="sec" aria-labelledby="s1"><div class="sec-label"><span class="n">01</span><h2 id="s1">Visão geral</h2></div>
<p class="body" style="margin: 0; font-size: 18px">Pagamentos Integrados é uma solução de pagamento via TEF, com PIX como condição de pagamento associada para as unidades de uma rede de franquias de clínicas odontológicas. O projeto começou em maio de 2025, mas até dezembro de 2025 ninguém tinha visibilidade do seu ritmo. A partir de fevereiro de 2026, assumi a gestão do produto: organizei o acompanhamento, conduzi quatro pilotos com a rede, em duas ondas, estruturei os manuais de apoio e, com Customer Success, apresentei o produto no lançamento para toda a franqueadora, em 9 de novembro de 2026.</p></section>

<section class="sec" aria-labelledby="s2"><div class="sec-label"><span class="n">02</span><h2 id="s2">Contexto</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="body" style="margin: 0">Empresa SaaS B2B com equipe técnica reduzida e um conselho que define prioridades. O cliente é uma franqueadora de clínicas odontológicas; cada unidade tem sua supervisora, e a rede conta com uma central de suporte e um time de assessoria próprios. A solução envolve ainda uma integradora e um parceiro financeiro, responsável pelas contas e pela TEF.</p>
<div class="who">
<div><b>Aurora</b>Produto, desenvolvimento, QA, Customer Success e Tech Lead</div>
<div><b>Rede TodoSorriso</b>Supervisora da rede, central de suporte, assessoria e supervisoras das unidades</div>
<div><b>Integradora</b>Conexão técnica entre sistema e meios de pagamento</div>
<div><b>Parceiro financeiro</b>Abertura de contas, TEF, custos e repasses</div>
</div>
</div></section>

<section class="sec" aria-labelledby="s3"><div class="sec-label"><span class="n">03</span><h2 id="s3">Problema</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="disp2" style="margin: 0; font-size: clamp(26px,2.6vw,36px)">De maio a dezembro de 2025, o projeto andava, mas ninguém sabia dizer em que ritmo, nem o que estava gerando valor.</p>
<ul class="two" style="margin: 0; padding: 0; list-style: none">
<li class="li">O conselho não tinha noção de quais entregáveis geravam valor para o negócio.</li>
<li class="li">O time acompanhava o produto apenas pelos tickets do Runrun.it, sem a visão do produto como negócio.</li>
<li class="li">Não havia estimativas reais de lançamento para alinhar expectativas com a diretoria.</li>
<li class="li">O desejo do conselho e o progresso técnico corriam em paralelo, sem um ponto de encontro.</li>
</ul>
</div></section>

<section class="sec" aria-labelledby="s4"><div class="sec-label"><span class="n">04</span><h2 id="s4">Meu papel</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="body" style="margin: 0">Gestão do produto desde fevereiro de 2026, da reorganização do acompanhamento até o lançamento.</p>
<ul class="two" style="margin: 0; padding: 0; list-style: none; gap: 10px">
<li class="li">Classificação das prioridades do conselho e acompanhamento em uma Esteira de Acompanhamento, apresentada semanalmente ao conselho</li>
<li class="li">Condução do alinhamento inicial com desenvolvedor, Customer Success, integradora e parceiro financeiro</li>
<li class="li">Gestão de quatro pilotos com a rede, em duas ondas (duas unidades, depois mais duas), com coleta de feedback, ajustes e padronização</li>
<li class="li">Elaboração dos manuais de apoio ao lançamento, após processo colaborativo com Tech Lead, desenvolvedor da TEF, CS, QA e um dos sócios</li>
<li class="li">Criação do board de onboarding e suporte da TEF no Runrun.it, com apoio de CS: etapas, condições de avanço, materiais de apoio e roteiro de perguntas do onboarding</li>
<li class="li">Apresentação do produto à supervisora da rede e à coordenadora da central de suporte, com CS</li>
<li class="li">Apresentação do produto no lançamento para toda a franqueadora, com CS</li>
</ul>
</div></section>

<section class="sec" aria-labelledby="s5"><div class="sec-label"><span class="n">05</span><h2 id="s5">Restrições</h2></div>
<ul class="two" style="margin: 0; padding: 0; list-style: none; gap: 10px">
<li class="li">Equipe técnica reduzida, com o mesmo time atendendo outros produtos e demandas</li>
<li class="li">Confiança da diretoria e do time de negócio abalada por meses sem visibilidade de prazos e entregas</li>
<li class="li">Dependência de terceiros: integradora e parceiro financeiro definem parte do fluxo, dos custos e dos prazos</li>
<li class="li">Produto que envolve dinheiro de clínicas: erro no piloto tem custo real para a unidade</li>
</ul></section>

<section class="sec" aria-labelledby="s6"><div class="sec-label"><span class="n">06</span><h2 id="s6">Descoberta</h2></div>
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="body" style="margin: 0">Antes de qualquer piloto, reuni desenvolvedor responsável, Customer Success, integradora e parceiro financeiro para levantar o que precisava estar claro para uma clínica operar o produto:</p>
<div class="who">
<div><b>Processos</b>Como a unidade orça, aprova, vende e cancela um atendimento com o produto</div>
<div><b>Fluxos</b>Quem faz o quê, do atendimento ao suporte</div>
<div><b>Custos e venda</b>Valores de custo, de venda e repasses entre as partes</div>
<div><b>Desejos reais</b>Durante os pilotos, as clínicas relataram o PIX como condição de pagamento necessária na TEF</div>
</div>
</div></section>

<section class="sec" aria-labelledby="s7"><div class="sec-label"><span class="n">07</span><h2 id="s7">Processo</h2></div>
<div style="display: flex; flex-direction: column; gap: 24px">
<p class="body" style="margin: 0">Nove movimentos entre fevereiro e novembro de 2026. Selecione cada um para ver o que foi feito.</p>
<div class="steps" role="group" aria-label="Etapas do projeto">
<sc-for list="{{ steps }}" as="st" hint-placeholder-count="9">
<sc-if value="{{ st.sel }}" hint-placeholder-val="{{ false }}">
<button type="button" class="step" aria-pressed="true" style="background: #2A1F33; color: #F8F4EF; border: 2px solid #2A1F33"><span class="kick" style="color: #D9A3B0; font-size: 11px">{{ st.when }}</span><span class="disp2" style="font-size: 20px">{{ st.name }}</span></button>
</sc-if>
<sc-if value="{{ st.unsel }}" hint-placeholder-val="{{ true }}">
<button type="button" class="step" aria-pressed="false" onClick="{{ st.pick }}" style="background: #FFFFFF; color: #2A1F33; border: 2px solid #E2D9D3"><span class="kick" style="font-size: 11px">{{ st.when }}</span><span class="disp2" style="font-size: 20px">{{ st.name }}</span></button>
</sc-if>
</sc-for>
</div>
<div aria-live="polite" class="card" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
<div><p class="kick" style="margin: 0 0 8px; font-size: 11px">{{ cur.when }}</p><p class="disp2" style="margin: 0 0 10px; font-size: 30px">{{ cur.name }}</p><p class="body" style="margin: 0; font-size: 15px">{{ cur.text }}</p></div>
<div style="background: #F3E3E3; border-radius: 14px; padding: 18px"><p class="kick" style="margin: 0 0 8px; font-size: 11px">Quem participou</p><p style="margin: 0; font-size: 14px; line-height: 1.6">{{ cur.who }}</p><p class="kick" style="margin: 14px 0 6px; font-size: 11px">O que mudou</p><p style="margin: 0; font-size: 14px; line-height: 1.6">{{ cur.out }}</p></div>
</div>
</div></section>

<section class="sec" aria-labelledby="s8"><div class="sec-label"><span class="n">08</span><h2 id="s8">Solução</h2></div>
<div style="display: flex; flex-direction: column; gap: 20px">
<p class="body" style="margin: 0">Quatro entregas estruturaram a passagem do piloto para a rede inteira.</p>
<div class="two" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr))">
<article class="card" style="display: flex; flex-direction: column; gap: 12px">
<span class="pill" style="background: #E4DBE6; align-self: flex-start">Esteira de Acompanhamento</span>
<p class="disp2" style="margin: 0; font-size: 24px">Prioridades do conselho lado a lado com o progresso dos produtos nível 1</p>
<p class="body" style="margin: 0; font-size: 14px">Apresentada semanalmente na reunião do conselho. Objetivo: resgatar a confiabilidade em entregas, prazos, estimativas e capacidade do time.</p>
</article>
<article class="card" style="display: flex; flex-direction: column; gap: 12px">
<span class="pill" style="background: #E4DBE6; align-self: flex-start">Manuais de apoio</span>
<p class="disp2" style="margin: 0; font-size: 24px">Documentação de lançamento escrita por mim após construção colaborativa</p>
<p class="body" style="margin: 0; font-size: 14px">Orçamento, aprovação, venda e cancelamento com o produto, fluxos de suporte e evoluções previstas, em linguagem para quem atende na clínica.</p>
</article>
<article class="card" style="display: flex; flex-direction: column; gap: 12px">
<span class="pill" style="background: #E4DBE6; align-self: flex-start">Treinamento e lançamento</span>
<p class="disp2" style="margin: 0; font-size: 24px">Simulação in loco com a assessoria e apresentação na reunião mensal da rede</p>
<p class="body" style="margin: 0; font-size: 14px">Com CS, desenvolvedor da TEF e QA: simulação de orçamento, aprovação, venda e cancelamento. Dúvidas sanadas antes do dia 9 de novembro.</p>
</article>
<article class="card" style="display: flex; flex-direction: column; gap: 12px">
<span class="pill" style="background: #E4DBE6; align-self: flex-start">Board de onboarding e suporte</span>
<p class="disp2" style="margin: 0; font-size: 24px">Fluxo da TEF no Runrun.it, com etapas, critérios de avanço e roteiro de onboarding</p>
<p class="body" style="margin: 0; font-size: 14px">Criado por mim com apoio de CS. Cada etapa tem descrição e condição para o ticket avançar; materiais de apoio anexados; um ticket guarda o roteiro de perguntas que todo onboarding deve responder.</p>
</article>
</div>
<figure style="margin: 8px 0 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><p class="disp2" style="margin: 0; font-size: 24px">A prancha da esteira apresentada ao conselho</p><span class="sim">Prancha original · nomes substituídos</span></div>
<button type="button" onClick="{{ openZoom }}" class="zoom-btn" aria-label="Ampliar a prancha da esteira" style="padding: 0; border: 0; background: transparent; cursor: zoom-in; border-radius: 20px; display: block; width: 100%; position: relative">
<img src="assets/prancha-tef.png" alt="Prancha da Esteira de Acompanhamento sobre Pagamentos Integrados, apresentada ao conselho em 12 de novembro de 2026: linha do tempo com piloto concluído em 4 unidades, lançamento em 9 de novembro, próximo marco de crédito na TEF em 16 de novembro e sustentação contínua; painel de onboarding com 8 franqueados interessados; painel de sustentação com triagem, quadro de chamados, ajustes mapeados e trade-off de capacidade; e quatro critérios propostos para liberar novas unidades" width="1600" height="900" style="width: 100%; height: auto; border-radius: 20px; border: 2px solid #E2D9D3; display: block">
<span aria-hidden="true" class="pill" style="position: absolute; right: 14px; bottom: 14px; background: #2A1F33; color: #F8F4EF; font-size: 12px">Ampliar ⤢</span>
</button>
<figcaption style="font-size: 14px; line-height: 1.6; color: #4F4556">Prancha original da reunião do conselho de 12 de novembro de 2026, três dias após o lançamento, com o mesmo design e conteúdo. Apenas nomes de empresa, rede, unidades, pessoas e parceiro foram substituídos. O formato é o mesmo usado toda semana: linha do tempo com marcos, frentes abertas, trade-offs de capacidade explicitados e critérios submetidos à aprovação do conselho.</figcaption>
</figure>
<sc-if value="{{ zoomOpen }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="Prancha da esteira ampliada" style="position: fixed; inset: 0; z-index: 100; background: rgba(42,31,51,.92); display: flex; flex-direction: column; padding: clamp(12px,2vw,28px); gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #F8F4EF">
<p style="margin: 0; font-size: 14px; font-weight: 600">Esteira de Acompanhamento · reunião do conselho de 12/11/2026 · prancha original com nomes substituídos</p>
<button type="button" onClick="{{ closeZoom }}" aria-label="Fechar ampliação" style="min-height: 44px; min-width: 44px; padding: 0 18px; border: 2px solid #F8F4EF; background: transparent; color: #F8F4EF; border-radius: 999px; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">Fechar ✕</button>
</div>
<div style="flex: 1; min-height: 0; overflow: auto; border-radius: 16px; background: #F8F4EF">
<img src="assets/prancha-tef.png" alt="Prancha da Esteira de Acompanhamento sobre Pagamentos Integrados, apresentada ao conselho em 12 de novembro de 2026: linha do tempo com piloto concluído em 4 unidades, lançamento em 9 de novembro, próximo marco de crédito na TEF em 16 de novembro e sustentação contínua; painel de onboarding com 8 franqueados interessados; painel de sustentação com triagem, quadro de chamados, ajustes mapeados e trade-off de capacidade; e quatro critérios propostos para liberar novas unidades" width="1600" height="900" style="display: block; width: 100%; min-width: 1100px; height: auto">
</div>
<button type="button" onClick="{{ closeZoom }}" aria-label="Fechar ampliação" style="position: absolute; inset: 0; z-index: -1; border: 0; background: transparent; cursor: zoom-out"></button>
</div>
</sc-if>

</div></section>

<section class="sec" aria-labelledby="s9"><div class="sec-label"><span class="n">09</span><h2 id="s9">Colaboração</h2></div>
<div class="who">
<div><b>Customer Success</b>Treinou as supervisoras das unidades piloto, acompanhou o suporte, apoiou a construção do board de onboarding e co-apresentou o produto no lançamento</div>
<div><b>Desenvolvedor da TEF</b>Alinhamento inicial, ajustes dos pilotos, manuais e treinamento da assessoria</div>
<div><b>Tech Lead, QA e sócio-coordenador</b>Construção colaborativa dos manuais de apoio; QA também no treinamento in loco</div>
<div><b>Integradora e parceiro financeiro</b>Processos, fluxos, custos, repasses e abertura de contas das unidades</div>
<div><b>Rede TodoSorriso</b>Supervisora da rede e coordenadora da central de suporte validaram o produto e a data de lançamento</div>
</div></section>

<section class="sec" aria-labelledby="s10"><div class="sec-label"><span class="n">10</span><h2 id="s10">Impacto</h2></div>

<p class="body" style="margin: 0">Além dos números: a diretoria voltou a ter base para decidir sobre prazos e capacidade, e a rede recebeu o produto com documentação, suporte treinado e uma data combinada, em vez de um lançamento silencioso. O interesse das oito unidades é um sinal de demanda, não contrato assinado; os resultados comerciais serão acompanhados a partir daqui.</p>

<ul class="two" style="margin: 0; padding: 0; list-style: none; gap: 10px">
<li class="li">Visibilidade vem antes de velocidade: o conselho só voltou a confiar quando passou a ver prioridades e progresso juntos, toda semana.</li>
<li class="li">Pilotos pequenos e em ondas: quatro ao todo, dois de cada vez, deixaram o suporte direcionado e os imprevistos menores.</li>
<li class="li">Ouvir o cliente no piloto muda o produto: o PIX entrou porque as clínicas pediram, não porque estava no plano.</li>
<li class="li">Operação precisa de um lugar: o board com etapas, critérios e roteiro tira o onboarding da cabeça de uma pessoa e coloca ao alcance do time.</li>
<li class="li">Documentar com quem faz: os manuais ficaram melhores porque Tech Lead, desenvolvedor, CS, QA e sócio construíram o conteúdo antes de eu escrever.</li>
