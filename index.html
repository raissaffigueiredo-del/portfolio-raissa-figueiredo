<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Raissa Figueiredo, Product Designer com experiência em UX/UI, Product Discovery, Service Design e SaaS B2B. Portfólio e estudos de caso.">
<title>Raissa Figueiredo · Product Designer | UX/UI | SaaS B2B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8F4EF;color:#2A1F33;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
a{color:#2A1F33}
:focus-visible{outline:3px solid #B5546A;outline-offset:3px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.disp{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.96}
.disp2{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.02}
.kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.lead{font-size:clamp(18px,1.5vw,21px);line-height:1.55;color:#4F4556}
.body{font-size:16px;line-height:1.65;color:#4F4556}
.h2{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.98;font-size:clamp(40px,5.4vw,76px);margin:0}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:700;text-decoration:none;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.b-ink{background:#2A1F33;color:#F8F4EF}.b-ink:hover{background:#B5546A;color:#F8F4EF}
.b-coral{background:#B5546A;color:#F8F4EF}.b-coral:hover{background:#2A1F33;color:#F8F4EF}
.b-out{border:2px solid #2A1F33;color:#2A1F33}.b-out:hover{background:#2A1F33;color:#F8F4EF}
.b-cream{background:#F8F4EF;color:#2A1F33}.b-cream:hover{background:#B5546A;color:#F8F4EF}
.navlink{text-decoration:none;color:#2A1F33;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;transition:background .2s}
.navlink:hover{background:#EFE8E1}
.navlink.on{background:#2A1F33;color:#F8F4EF}
.nav-desk{display:flex}.nav-mob{display:none}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:clamp(32px,5vw,72px);align-items:center}
.arch{position:relative;aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;background:#E4DBE6}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.marq{overflow:hidden;white-space:nowrap;background:#2A1F33;color:#F8F4EF}
.marq-in{display:inline-flex;gap:0;animation:slide 28s linear infinite}
.marq-in span{padding:14px 28px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:28px}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.case{border-radius:28px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden;color:#2A1F33;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.case:hover{transform:translateY(-6px);box-shadow:0 30px 60px -36px rgba(36,26,46,.45)}
.stack{position:relative;height:250px;perspective:1200px}
.layer{position:absolute;left:0;right:0;background:#FFFFFF;border:1px solid #E2D9D3;border-radius:16px;box-shadow:0 14px 30px -18px rgba(36,26,46,.4);padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.l1{top:0;transform:translateY(0) scale(.92);opacity:.85}
.l2{top:34px;transform:translateY(0) scale(.96);opacity:.95}
.l3{top:68px;transform:translateY(0)}
.case:hover .l1{transform:translateY(-14px) scale(.92) rotate(-1.2deg)}
.case:hover .l2{transform:translateY(-6px) scale(.96) rotate(.6deg)}
.case:hover .l3{transform:translateY(4px) rotate(-.4deg)}
.seg{display:inline-flex;background:rgba(36,26,46,.08);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:40px;padding:0 16px;font:600 13px 'DM Sans',sans-serif;color:#2A1F33;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:#2A1F33;color:#F8F4EF}
.bar{height:10px;border-radius:999px;background:#EFE8E1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.line{height:8px;border-radius:999px;background:#EFE8E1}
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.yr{height:64px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:15px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.step{border-radius:20px;padding:22px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:transform .3s}
.step:hover{transform:translateY(-4px) rotate(-.5deg)}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;border:2px solid transparent}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid #E2D9D3}
.tl-when{display:flex;flex-direction:column;gap:4px}
.tl-what{display:flex;flex-direction:column;gap:12px}
.tl-chip{background:#EFE8E1;font-size:13px;padding:7px 12px}
.tl-chip-dark{background:#2A1F33;color:#F8F4EF;font-size:13px;padding:7px 12px}
details summary::-webkit-details-marker{display:none}
.edu{display:grid;grid-template-columns:70px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:2px dashed #E2D9D3;font-size:15px}
.fade{animation:up 1s ease both}.fade2{animation:up 1s .15s ease both}.fade3{animation:up 1s .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-width:1080px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.hero,.cases,.skills,.tl-row{grid-template-columns:minmax(0,1fr)}.nav-desk{display:none}.nav-mob{display:flex}.track{grid-template-columns:repeat(3,minmax(0,1fr))}.tl-before{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:600px){.steps{grid-template-columns:minmax(0,1fr)}.stack{height:270px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.marq-in{animation:none!important;flex-wrap:wrap;white-space:normal}}
</style>
<script src="assets/runtime.js"></script>
</head>
<body>
<div id="app"></div>
<template data-dc>

<div style="background: #F8F4EF; color: #2A1F33; min-height: 100vh">
<a href="#inicio" style="position: absolute; left: -9999px; top: 8px; background: #2A1F33; color: #F8F4EF; padding: 12px 16px; z-index: 60; text-decoration: none; font-size: 14px">Pular para o conteúdo</a>

<!-- NAV -->
<header style="position: sticky; top: 0; z-index: 40; background: rgba(251,246,238,.9); backdrop-filter: blur(12px)">
<div class="wrap" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 76px">
<a href="#inicio" style="text-decoration: none; display: inline-flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 999px 999px 8px 8px; background: #B5546A; display: inline-block"></span>
<span class="disp2" style="font-size: 20px">Raissa Figueiredo</span>
</a>
<nav aria-label="Navegação principal" class="nav-desk" style="align-items: center; gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 6px; box-shadow: 0 8px 24px -16px rgba(36,26,46,.35)">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
<sc-if value="{{ item.active }}" hint-placeholder-val="{{ false }}"><a href="{{ item.href }}" class="navlink on" aria-current="true">{{ item.label }}</a></sc-if>
<sc-if value="{{ item.inactive }}" hint-placeholder-val="{{ true }}"><a href="{{ item.href }}" class="navlink" onClick="{{ item.go }}">{{ item.label }}</a></sc-if>
</sc-for>
</nav>
<div style="display: flex; gap: 8px; align-items: center">
<a href="#contato" class="btn b-ink nav-desk" style="min-height: 46px; padding: 0 20px; font-size: 14px">Vamos conversar</a>
<div class="nav-mob">
<button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuExpanded }}" aria-controls="menu-mobile" style="min-height: 46px; min-width: 46px; padding: 0 18px; border: 2px solid #2A1F33; background: #FFFFFF; border-radius: 999px; font: 700 14px 'DM Sans', sans-serif; color: #2A1F33; cursor: pointer">{{ menuLabel }}</button>
</div>
</div>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav id="menu-mobile" aria-label="Navegação mobile" style="background: #F8F4EF; border-bottom: 2px solid #2A1F33">
<div class="wrap" style="display: flex; flex-direction: column; padding-top: 8px; padding-bottom: 24px">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
<a href="{{ item.href }}" onClick="{{ item.goClose }}" class="disp2" style="text-decoration: none; font-size: 34px; padding: 12px 0; border-bottom: 1px solid #E2D9D3">{{ item.label }}</a>
</sc-for>
<a href="#contato" onClick="{{ closeMenu }}" class="btn b-coral" style="margin-top: 20px; justify-content: center">Vamos conversar</a>
</div>
</nav>
</sc-if>
</header>

<main>

<!-- HERO -->
<section id="inicio" data-section="1" aria-labelledby="hero-title" style="padding: clamp(40px,6vw,88px) 0 clamp(56px,7vw,96px)">
<div class="wrap hero">
<div style="display: flex; flex-direction: column; gap: 28px">
<div class="fade" style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="pill" style="background: #2A1F33; color: #F8F4EF">Product Designer</span>
<span class="pill" style="background: #FFFFFF; border: 2px solid #2A1F33">UX/UI</span>
<span class="pill" style="background: #FFFFFF; border: 2px solid #2A1F33">SaaS B2B</span>
<span class="pill" style="background: #FFFFFF; border: 2px solid #2A1F33"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #B5546A; display: inline-block"></span>Aberta a oportunidades remotas no Brasil</span>
</div>
<h1 id="hero-title" class="disp fade2" style="margin: 0; font-size: clamp(52px,7.6vw,116px)">Design que transforma complexidade em <span style="color: #B5546A; font-style: italic; font-weight: 700">clareza.</span></h1>
<p class="lead fade3" style="margin: 0; max-width: 580px">Conecto experiência do usuário, estratégia de produto e necessidades de negócio para estruturar soluções digitais que fazem sentido para pessoas e organizações.</p>
<div class="fade3" style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#projetos" class="btn b-coral">Explorar projetos <span aria-hidden="true">↓</span></a>
<a href="#trajetoria" class="btn b-out">Conhecer minha trajetória</a>
</div>
<p class="fade3" style="margin: 0; font-size: 14px; color: #4F4556; display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span style="font-weight: 700">UX/UI</span><span aria-hidden="true" style="color: #B5546A">→</span><span style="font-weight: 700">Product Design</span><span aria-hidden="true" style="color: #B5546A">→</span><span style="font-weight: 700">Produto e Estratégia</span><span style="color: #857A8C">· desde 2021 em produtos SaaS B2B, com 5 estudos de caso documentados.</span></p>
</div>
<div class="fade2" style="position: relative; max-width: 440px; width: 100%; justify-self: end">
<div aria-hidden="true" style="position: absolute; inset: 18px -18px -18px 18px; border-radius: 999px 999px 28px 28px; background: #B5546A"></div>
<figure class="arch" style="margin: 0">
<img src="assets/raissa.jpg" alt="Retrato de Raissa Figueiredo sorrindo, com cabelos escuros ondulados e blusa azul-marinho de poás, em fundo claro" width="900" height="1131">
</figure>
<span aria-hidden="true" class="pill" style="position: absolute; left: -18px; bottom: 56px; background: #FFFFFF; transform: rotate(-6deg); box-shadow: 0 10px 24px -14px rgba(36,26,46,.5)">Clarity by Design</span>
<span aria-hidden="true" class="pill" style="position: absolute; right: -10px; top: 32px; background: #2A1F33; color: #F8F4EF; transform: rotate(5deg)">desde 2021 em SaaS B2B</span>
</div>
</div>
</section>

<!-- MARQUEE -->
<div class="marq" aria-hidden="true">
<div class="marq-in">
<span>Product Discovery <i style="font-style: normal">✦</i> Service Design <i style="font-style: normal">✦</i> Information Architecture <i style="font-style: normal">✦</i> UX Writing <i style="font-style: normal">✦</i> Product Strategy <i style="font-style: normal">✦</i> Product Operations <i style="font-style: normal">✦</i> Prototipação <i style="font-style: normal">✦</i> Stakeholder Management <i style="font-style: normal">✦</i></span>
<span>Product Discovery <i style="font-style: normal">✦</i> Service Design <i style="font-style: normal">✦</i> Information Architecture <i style="font-style: normal">✦</i> UX Writing <i style="font-style: normal">✦</i> Product Strategy <i style="font-style: normal">✦</i> Product Operations <i style="font-style: normal">✦</i> Prototipação <i style="font-style: normal">✦</i> Stakeholder Management <i style="font-style: normal">✦</i></span>
</div>
</div>

<!-- SOBRE -->
<section id="sobre" data-section="1" aria-labelledby="sobre-title" style="padding: clamp(80px,10vw,136px) 0">
<div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: clamp(32px,5vw,80px); align-items: start">
<div style="display: flex; flex-direction: column; gap: 24px">
<p class="kick" style="margin: 0; color: #B5546A">Sobre mim</p>
<h2 id="sobre-title" class="h2">Projetar sempre foi a minha forma de compreender o mundo.</h2>
<div style="background: #2A1F33; color: #F8F4EF; border-radius: 24px; padding: 28px 30px; display: flex; flex-direction: column; gap: 10px">
<span aria-hidden="true" class="disp" style="font-size: 56px; color: #B5546A; line-height: .6">“</span>
<p class="disp2" style="margin: 0; font-size: clamp(22px,2vw,28px)">Meu trabalho começa antes da interface: começa na compreensão do problema.</p>
</div>
</div>
<div class="body" style="display: flex; flex-direction: column; gap: 16px; font-size: 17px">
<p style="margin: 0">Sou Product Designer e atuo desde 2021 em uma empresa de tecnologia SaaS B2B, onde comecei em UX/UI Design, com interfaces, design visual e prototipação.</p>
<p style="margin: 0">Com o tempo, meu repertório se ampliou para além das interfaces. Passei a trabalhar com discovery, estruturação de jornadas, documentação funcional, gestão de prioridades, comunicação entre negócio e tecnologia e desenho de processos e serviços.</p>
<p style="margin: 0">Atuar em um ambiente com recursos limitados, equipes enxutas e múltiplos stakeholders me ensinou que uma boa experiência não depende apenas de uma interface bem resolvida. Ela depende também de clareza, colaboração, decisões consistentes e compreensão do ecossistema no qual o produto está inserido.</p>
<p style="margin: 0">Minha formação em Arquitetura e Urbanismo é a base desse olhar: leitura de contexto, análise de restrições e foco em quem usa.</p>
<p style="margin: 0; color: #2A1F33; font-weight: 600">Hoje, conecto design, pensamento analítico e estratégia de produto para transformar problemas complexos em soluções mais claras, viáveis e orientadas a resultados.</p>
</div>
</div>
</section>

<!-- PROJETOS -->
<section id="projetos" data-section="1" aria-labelledby="proj-title" style="padding: clamp(80px,10vw,136px) 0; background: #EFE8E1; border-radius: 48px 48px 0 0">
<div class="wrap" style="display: flex; flex-direction: column; gap: 48px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; align-items: end">
<div style="display: flex; flex-direction: column; gap: 20px"><p class="kick" style="margin: 0; color: #B5546A">Projetos em destaque</p><h2 id="proj-title" class="h2">Alguns dos problemas que ajudei a transformar em soluções.</h2></div>
<p class="lead" style="margin: 0">Selecionei experiências que demonstram diferentes dimensões da minha atuação: investigação de problemas, desenho de jornadas, organização de informações, construção de processos e estratégia de produto. <span style="font-size: 14px; color: #857A8C; display: block; margin-top: 8px">Nomes e dados fictícios. Artefatos reconstruídos para fins ilustrativos.</span></p>
</div>

<div class="cases">
<sc-for list="{{ cases }}" as="c" hint-placeholder-count="5">
<article class="case" style="background: {{ c.bg }}" aria-labelledby="{{ c.id }}">
<div style="display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="kick" style="font-size: 12px; opacity: .8">Case {{ c.n }} · {{ c.cat }}</span>
<h3 id="{{ c.id }}" class="disp2" style="margin: 0; font-size: clamp(28px,2.6vw,38px)">{{ c.title }}</h3>
</div>
<span class="pill" style="background: #2A1F33; color: #F8F4EF">{{ c.kind }}</span>
</div>

<div class="stack" aria-hidden="true">
<div class="layer l1"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #857A8C">{{ c.a1 }}</span><div class="line" style="width: 70%"></div><div class="line" style="width: 45%"></div></div>
<div class="layer l2"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #857A8C">{{ c.a2 }}</span><div style="display: flex; gap: 6px"><sc-for list="{{ c.pillsA }}" as="p" hint-placeholder-count="3"><span style="font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 999px; background: #EFE8E1">{{ p }}</span></sc-for></div></div>
<div class="layer l3"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #857A8C">{{ c.a3 }}</span>
<sc-for list="{{ c.bars }}" as="b" hint-placeholder-count="3"><div style="display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12px; font-weight: 600"><span>{{ b.l }}</span><div class="bar"><i style="width: {{ b.w }}; background: {{ c.acc }}"></i></div></div></sc-for>
</div>
</div>

<div class="seg" role="group" aria-label="Ver detalhes do case {{ c.n }}">
<button type="button" aria-pressed="{{ c.pP }}" onClick="{{ c.setP }}">Problema</button>
<button type="button" aria-pressed="{{ c.pD }}" onClick="{{ c.setD }}">Minha contribuição</button>
<button type="button" aria-pressed="{{ c.pR }}" onClick="{{ c.setR }}">Resultado</button>
</div>
<p aria-live="polite" style="margin: 0; font-size: 15px; line-height: 1.6; min-height: 72px; color: #2A1F33">{{ c.text }}</p>

<a href="{{ c.href }}" class="btn b-ink" style="align-self: flex-start" aria-label="Abrir estudo de caso completo: {{ c.title }}">Abrir estudo de caso <span aria-hidden="true">→</span></a>
</article>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span class="pill" style="background: #EFE8E1; align-self: flex-start">Product Discovery</span><p class="disp2" style="margin: 6px 0 0; font-size: 24px">Discovery Assíncrono</p><p class="body" style="margin: 0; font-size: 14px">Lean Inception e Matriz CSD adaptadas para estruturar hipóteses, validações e escopo de MVP com profissionais de diferentes áreas.</p></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span class="pill" style="background: #EFE8E1; align-self: flex-start">Diagnóstico</span><p class="disp2" style="margin: 6px 0 0; font-size: 24px">Diagnóstico TodoSorriso 360</p><p class="body" style="margin: 0; font-size: 14px">Construído com coordenação de Desenvolvimento/Produto/Inovação e Customer Success. Informações operacionais das unidades viram necessidades e oportunidades de produto.</p></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px"><span class="pill" style="background: #EFE8E1; align-self: flex-start">Estratégia</span><p class="disp2" style="margin: 6px 0 0; font-size: 24px">Expansão Nexo</p><p class="body" style="margin: 0; font-size: 14px">Estratégia comercial que concebi e estruturei, validada pela área de negócios. Cenários de planejamento, não resultados realizados.</p></div>
